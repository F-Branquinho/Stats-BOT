name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t stats-bot:ci .

      - name: Start the container (no token, so it waits on the setup page)
        run: docker run -d --name stats-bot -p 3000:3000 stats-bot:ci

      - name: /health answers "setup needed"
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health | grep -q "setup needed"; then
              curl -s http://localhost:3000/health
              exit 0
            fi
            sleep 1
          done
          echo "The site never answered on /health"
          exit 1

      - name: The setup page renders
        run: |
          curl -fsS http://localhost:3000/setup | grep -q "<h1>Bot setup</h1>"

      - name: The setup code is in the logs
        run: |
          docker logs stats-bot 2>&1 | grep -E "Setup code: [A-Z0-9]{4}-[A-Z0-9]{4}"

      - name: The database works inside the image
        run: |
          docker exec stats-bot node -e "require('./src/db').abrirBD('/app/data/ci.db').contarPartidas()"

      - name: Container logs
        if: always()
        run: docker logs stats-bot || true
